<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方程式の難易度 — 電力系統で辿る解法の地図</title>
<style>
:root{
  --paper:#ffffff; --chrome:#f4f6f8; --rule:#dfe5eb; --hair:#eef2f5;
  --ink:#141c25; --body:#3d4c5a; --dim:#6d7f8f; --faint:#a4b2be;
  --d:#c2410c; --l:#0e7490; --u:#7e22ce; --ok:#15803d; --ng:#be123c; --gold:#a16207;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
  --math:"STIX Two Math","Cambria Math","Latin Modern Roman","Hiragino Mincho ProN",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e7ebef}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ── 16:9 固定ステージ（ウィンドウに合わせて等比縮小） ── */
#wrap{position:fixed;inset:0 0 58px 0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;background:var(--paper);position:relative;flex:none;
  transform-origin:center center;box-shadow:0 2px 24px rgba(20,32,45,.14);overflow:hidden}
.sl{position:absolute;inset:0;padding:40px 72px 40px;display:none;font-size:17px;line-height:1.72}
.sl.on{display:block}

/* ヘッダ */
.shead{display:flex;align-items:baseline;gap:16px;height:26px}
.shead .lv{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--faint)}
.shead .tp{font-size:13px;color:var(--dim);letter-spacing:.04em}
.shead .no{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--faint)}
h2{font-size:40px;font-weight:700;line-height:1.26;letter-spacing:-.02em;margin-top:14px;
  height:52px;overflow:hidden}
.msg{font-size:19px;color:var(--body);margin-top:10px;line-height:1.62;height:32px;overflow:hidden}
.rulez{height:1px;background:var(--hair);margin-top:16px}

/* コンテンツ枠：ヘッダ下からバーまでを埋める */
.body{position:absolute;left:72px;right:72px;top:212px;bottom:40px}
.sl.tall .body{top:170px}
.sl.tall h2{height:auto;min-height:52px}

/* 数式 */
.eqz{text-align:center}
.mq{font-family:var(--math);font-size:34px;line-height:1.7;color:var(--ink);display:inline-block;
  text-align:left;white-space:nowrap;max-width:100%}
.mq.wrap{white-space:normal}
.mq.sm{font-size:24px} .mq.xs{font-size:19px;line-height:1.9}
.mq .v{font-style:italic}
.mq .o{font-style:normal;margin:0 .30em;color:var(--dim)}
.mq .fn{font-style:normal;margin-right:.14em}
.mq sub{font-size:.60em;font-style:normal;vertical-align:-.32em}
.mq sup{font-size:.60em;vertical-align:.52em}
.mq .fr{display:inline-flex;flex-direction:column;vertical-align:-.62em;text-align:center;margin:0 .22em}
.mq .fr>b{font-weight:inherit;border-bottom:1.5px solid currentColor;padding:0 .36em;display:block;font-size:.86em}
.mq .fr>i{font-style:inherit;padding:0 .36em;display:block;font-size:.86em}
.mq .sg{font-size:1.42em;vertical-align:-.14em;font-style:normal;margin-right:.05em}
.mq .t{transition:opacity .3s,color .3s;padding:0 .06em;border-radius:3px}
.mq .t.dim{opacity:.2}
.mq .t.hot{background:rgba(20,28,37,.055);box-shadow:0 3px 0 currentColor}
.cap{font-family:var(--sans);font-size:14px;color:var(--faint);margin-top:14px}

/* 図 */
.figz{display:flex;align-items:center;justify-content:center}
canvas{display:block}
.cap2{font-size:14.5px;color:var(--dim);line-height:1.7;max-width:104ch;margin:0 auto}
.cap2 b{color:var(--ink)}

/* 語り（高さ固定でガタつかせない） */
.say{font-size:18px;color:var(--body);line-height:1.66;border-left:4px solid var(--hair);
  padding-left:20px;transition:border-color .3s;overflow:hidden}
.say.k{border-left-color:currentColor}
.say b{color:var(--ink)}

/* レイアウト種別 */
.body.hero{display:grid;grid-template-rows:auto 1fr auto;gap:14px}
.body.hero .figz{min-height:0}
.body.hero .say{height:92px;display:flex;align-items:center;font-size:17px}
.body.split{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.body.split .lft{display:flex;flex-direction:column;gap:26px}
.body.split .say{height:150px}
.body.algo{display:grid;grid-template-rows:auto 1fr;gap:12px}
.body.algo .row{display:grid;grid-template-columns:1fr 700px;gap:36px;min-height:0;height:100%}
.body.algo .row>div{min-height:0;overflow:hidden}
.body.board{overflow:hidden}
.body.derive{display:grid;grid-template-rows:auto auto auto auto 1fr;gap:8px;text-align:center}
.dvPrev{min-height:44px;display:flex;align-items:center;justify-content:center;opacity:.5}
.dvArrow{min-height:42px;display:flex;align-items:center;justify-content:center;gap:16px}
.dvArrow .ar{font-size:26px;color:var(--d);line-height:1}
.dvArrow .asm{font-size:17px;color:var(--d);border:1px solid rgba(194,65,12,.35);
  background:rgba(194,65,12,.07);border-radius:22px;padding:5px 20px;font-weight:600}
.dvNow{min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.body.derive .say{text-align:left;max-width:104ch;margin:2px auto 0;height:74px;
  display:flex;align-items:center;font-size:16.5px}
.dvFoot{display:grid;grid-template-columns:1fr 1fr;gap:44px;text-align:left;align-self:start;
  max-width:1200px;margin:0 auto;width:100%}
.dvFoot ol{padding-left:24px;font-size:15.5px;line-height:1.85;color:var(--body)}
.dvFoot li{margin-bottom:2px}
.dvFoot li.fresh{color:var(--ink);font-weight:600}
.mq .kill{color:var(--ng);text-decoration:line-through;text-decoration-thickness:1.6px;
  text-decoration-color:rgba(190,18,60,.75)}
.mq .keep{color:var(--ok)}
.body.board table.tb{font-size:15px}
.body.board .tb th,.body.board .tb td{padding:7px 11px}
.body.board .card p,.body.board .card li{font-size:15px}
.body.split>div{max-height:100%;overflow:hidden}
.body.split .card p,.body.split .card li{font-size:14.5px;line-height:1.6}
.body.split table.tb{font-size:14px}
.body.split .tb th,.body.split .tb td{padding:6px 9px}

/* カード */
.cards{display:grid;gap:26px}
.cards.c2{grid-template-columns:1fr 1fr} .cards.c3{grid-template-columns:repeat(3,1fr)}
.card{border-top:2px solid var(--hair);padding-top:12px}
.card h4{font-size:14px;color:var(--dim);font-weight:700;margin-bottom:7px}
.card p,.card li{font-size:16px;color:var(--body);line-height:1.66}
.card ul{padding-left:19px}
table.tb{border-collapse:collapse;width:100%;font-size:16px}
.tb th,.tb td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--hair)}
.tb th{color:var(--dim);font-weight:700;font-size:13.5px}
.tb td{color:var(--body)} .tb td.n,.tb th.n{font-family:var(--mono);text-align:right}
.tb tr.hi td{color:var(--ok);font-weight:600}
.tag{display:inline-block;font-size:12px;font-family:var(--mono);padding:1px 7px;border-radius:2px;
  border:1px solid var(--rule);color:var(--dim)}
.tag.on{color:var(--ng);border-color:rgba(190,18,60,.4);background:rgba(190,18,60,.06)}
.tag.free{color:var(--ok);border-color:rgba(21,128,61,.35);background:rgba(21,128,61,.06)}

/* ステッパー */
.stp{border:1px solid var(--rule);border-radius:6px;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;min-height:0;height:100%}
.stwork{padding:14px 18px 6px;overflow:auto;background:#fcfdfe;border-bottom:1px solid var(--hair);flex:0 1 auto}
.strow{display:flex;gap:14px;align-items:baseline;padding:8px 18px;border-top:1px solid var(--hair)}
.stlab{flex:0 0 34px;font-size:12px;color:var(--faint);text-align:right}
.stv{flex:1;line-height:1.85;min-width:0}
.stv.sym{font-family:var(--math);font-size:19px;color:var(--body)}
.stv.num{font-family:var(--mono);font-size:14px;color:var(--body)}
.stv.res{font-family:var(--mono);font-size:15.5px;color:var(--ok);font-weight:600}
.stnote{padding:9px 18px 14px 66px;font-size:14px;color:var(--dim);line-height:1.6}
.stph{font-size:12.5px;color:var(--d);font-family:var(--mono)}

/* 行列 */
.mx{display:inline-block;font-family:var(--mono);font-size:14px;vertical-align:middle;
  position:relative;padding:0 11px;margin:2px 6px}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:1.5px solid var(--faint)}
.mx::before{left:0;border-right:0} .mx::after{right:0;border-left:0}
.mx table{border-collapse:collapse}
.mx td{padding:3px 10px;text-align:right;color:var(--dim);border-radius:2px;transition:.2s}
.mx td.D{color:var(--d)} .mx td.L{color:var(--l)} .mx td.U{color:var(--u)} .mx td.z{color:#ccd6de}
.mx td.hl{background:rgba(21,128,61,.12);color:var(--ok);font-weight:700}
.mx td.hl2{background:rgba(194,65,12,.11);color:var(--d);font-weight:600}
.mx td.hl3{background:rgba(190,18,60,.09);color:var(--ng)}
.mx td.old{color:var(--faint)} .mx td.sep{border-left:1px solid var(--rule)}
.mxlab{font-family:var(--math);font-style:italic;font-size:17px;color:var(--dim);margin:0 5px;vertical-align:middle}
.mx td{height:26px}
.mx td.row{background:rgba(20,28,37,.035)}
.mop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mop .arw{font-size:24px;color:var(--faint);font-family:var(--math)}
.mtab{display:inline-flex;align-items:center;gap:5px}
.mtab .rlab,.mtab .rnote{display:flex;flex-direction:column;font-size:12.5px}
.mtab .rlab{font-family:var(--math);font-style:italic;font-size:15px;color:var(--faint);text-align:right}
.mtab .rlab>span,.mtab .rnote>span{height:26px;display:flex;align-items:center}
.mtab .rlab>span{justify-content:flex-end}
.mtab .rnote{color:var(--d);white-space:nowrap}
.mtag{font-size:12.5px;color:var(--dim);font-family:var(--sans);
  border:1px solid var(--rule);border-radius:3px;padding:2px 9px;background:var(--chrome)}
.calc{margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--body);line-height:1.95;
  border-top:1px dashed var(--rule);padding-top:9px}
.calc .lbl{font-family:var(--sans);font-size:12px;color:var(--faint);margin-bottom:3px}
.calc b{color:var(--ok);font-weight:700}
.calc b.z0{color:var(--ng)}
table.lh{border-collapse:collapse;margin:6px 0 2px;font-family:var(--mono);font-size:14px}
.lh td{padding:4px 12px;text-align:right;color:var(--body);white-space:nowrap}
.lh td.sep{border-left:1px solid var(--rule)}
.lh td.hi{background:rgba(190,18,60,.09);color:var(--ng);font-weight:700;border-radius:2px}
.lh .lh-op{color:var(--dim);font-size:17px;padding-right:2px;text-align:right;width:22px}
.lh .lh-lab{font-family:var(--math);font-style:italic;font-size:15px;color:var(--faint);
  text-align:right;padding-right:16px}
.lh .lh-note{font-family:var(--sans);font-size:12px;color:var(--d);text-align:left;padding-left:14px}
.lh tr.pv td{color:var(--d)}
.lh tr.mul td{color:var(--dim);height:20px;padding:1px 12px}
.lh tr.rule td{border-top:1.6px solid var(--ink);padding-top:6px}
.lh tr.res td{color:var(--ok);font-weight:700}
.lh tr.res td.lh-lab,.lh tr.res td.lh-note{font-weight:400}
.cD{color:var(--d)}.cL{color:var(--l)}.cU{color:var(--u)}.cO{color:var(--ok)}.cN{color:var(--ng)}.cM{color:var(--faint)}
.dimtx{color:var(--dim)} .m{font-family:var(--mono);font-size:.9em;color:var(--ok)}

/* コントロール */
.ctl{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--dim)}
.ctl label{flex:0 0 auto;min-width:110px}
.ctl input[type=range]{width:300px;-webkit-appearance:none;appearance:none;height:4px;
  background:var(--rule);border-radius:2px;outline:none}
.ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--ok);cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule)}
.ctl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ok);
  cursor:pointer;border:2px solid #fff}
.ctl .val{font-family:var(--mono);color:var(--ink);font-weight:600;min-width:72px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:#fff}
.seg button{background:transparent;border:0;border-right:1px solid var(--rule);color:var(--dim);
  font:inherit;font-size:15px;padding:7px 18px;cursor:pointer;transition:.15s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--chrome)}
.seg button.on{background:var(--ok);color:#fff;font-weight:600}

/* ── 下部バー ── */
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;padding:0 22px;z-index:40}
.bt{border:1px solid var(--rule);background:#fff;border-radius:5px;color:var(--dim);
  font:inherit;font-size:13.5px;padding:7px 15px;cursor:pointer;transition:.14s}
.bt:hover:not(:disabled){color:var(--ink);border-color:var(--dim)}
.bt:disabled{opacity:.3;cursor:default}
.bt.go{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;padding:7px 22px}
.bt.go:hover:not(:disabled){background:#17703a}
.bt.go:disabled{background:var(--chrome);color:var(--faint);border-color:var(--rule)}
#where{font-size:13px;color:var(--dim);margin-left:6px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:38vw}
#where b{color:var(--ink)}
#dots{display:flex;gap:6px;margin-left:auto}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--rule);display:block;transition:.2s}
#dots i.on{background:var(--ok);transform:scale(1.4)} #dots i.past{background:#a8cfb6}
#hint{font-size:12px;color:var(--faint);font-family:var(--mono);margin-left:16px}
#hint kbd{border:1px solid var(--rule);border-radius:2px;padding:0 4px;background:var(--chrome)}
@media(max-width:1100px){#hint{display:none}}

/* ── 目次ドロワー ── */
#rail{position:fixed;left:0;top:0;bottom:58px;width:330px;background:#fff;border-right:1px solid var(--rule);
  overflow-y:auto;z-index:50;transform:translateX(-100%);transition:transform .22s;padding:18px 0 24px;
  box-shadow:4px 0 24px rgba(20,32,45,.08)}
body.nav #rail{transform:none}
#rail h1{font-size:13px;font-weight:700;color:var(--dim);padding:0 20px 14px;line-height:1.6;
  border-bottom:1px solid var(--rule)}
.grp{font-size:11px;font-family:var(--mono);color:var(--faint);letter-spacing:.14em;padding:14px 20px 4px}
.rw{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:14px;
  color:var(--dim);padding:5px 20px 5px 24px;cursor:pointer;border-left:3px solid transparent;
  transition:.15s;line-height:1.5}
.rw:hover{color:var(--ink);background:var(--chrome)}
.rw.on{color:var(--ink);font-weight:700;border-left-color:var(--ok);background:var(--chrome)}
.rw.done{color:var(--faint)}
#scrim{position:fixed;inset:0;background:rgba(20,32,45,.18);z-index:45;opacity:0;pointer-events:none;
  transition:opacity .2s}
body.nav #scrim{opacity:1;pointer-events:auto}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="scrim"></div>
<nav id="rail"><h1>方程式の難易度<br>電力系統で辿る解法の地図</h1><div id="rws"></div></nav>
<div id="wrap"><div id="stage"></div></div>
<div id="bar">
  <button class="bt" id="bNav">目次</button>
  <button class="bt" id="bPrev">◀</button>
  <button class="bt go" id="bNext">次へ ▶</button>
  <button class="bt" id="bSkip">10手</button>
  <button class="bt" id="bAuto">自動</button>
  <span id="where"></span>
  <div id="dots"></div>
  <span id="hint"><kbd>←</kbd><kbd>→</kbd> スライド <kbd>Space</kbd> ステップ <kbd>M</kbd> 目次</span>
</div>
<script>
/* =========================================================
   描画基盤
   ========================================================= */
const CSSV=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const COL={};
['ink','body','dim','faint','rule','hair','d','l','u','ok','ng','gold','paper','chrome']
  .forEach(k=>COL[k]=CSSV('--'+k));
const SANS='"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const MATH='"STIX Two Math","Cambria Math",Georgia,"Times New Roman",serif';
const MONO='ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",monospace';
const _cx={};
function cx(id){
  if(_cx[id])return _cx[id];
  const c=document.getElementById(id); if(!c)return null;
  const sc=+(c.dataset.scale||1);
  const r=Math.min(window.devicePixelRatio||1,2)*sc, w=c.width, h=c.height;
  c.style.width=Math.round(w*sc)+'px'; c.style.height=Math.round(h*sc)+'px';
  c.width=Math.round(w*r); c.height=Math.round(h*r);
  const g=c.getContext('2d'); g.scale(r,r); g.W=w; g.H=h;
  return _cx[id]=g;
}
const clr=g=>g.clearRect(0,0,g.W,g.H);
function T(g,s,x,y,col,sz,al,fam,it){
  g.save(); g.fillStyle=col||COL.dim;
  g.font=(it?'italic ':'')+(sz||12)+'px '+(fam==='m'?MATH:fam==='o'?MONO:SANS);
  g.textAlign=al||'left'; g.textBaseline='middle'; g.fillText(String(s),x,y); g.restore();
}
const TM=(g,s,x,y,c,sz,al)=>T(g,s,x,y,c,sz,al,'m',true);
function LN(g,p,col,w,dash){
  if(!p||p.length<2)return;
  g.save(); g.strokeStyle=col; g.lineWidth=w||1.6; g.lineJoin='round'; g.lineCap='round';
  if(dash)g.setLineDash(dash);
  g.beginPath(); g.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);
  g.stroke(); g.restore();
}
const DOT=(g,x,y,c,r)=>{g.save();g.fillStyle=c;g.beginPath();g.arc(x,y,r||3.4,0,7);g.fill();g.restore();};
function AR(g,x1,y1,x2,y2,col,w,dash){
  g.save(); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=w||1.7; g.lineCap='round';
  if(dash)g.setLineDash(dash);
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1), s=8;
  g.beginPath(); g.moveTo(x2,y2);
  g.lineTo(x2-s*Math.cos(a-.40),y2-s*Math.sin(a-.40));
  g.lineTo(x2-s*Math.cos(a+.40),y2-s*Math.sin(a+.40));
  g.closePath(); g.fill(); g.restore();
}
function GR(g,x,y,w,h,nx,ny){
  g.save(); g.strokeStyle=COL.hair; g.lineWidth=1;
  for(let i=0;i<=nx;i++){const a=Math.round(x+w*i/nx)+.5;g.beginPath();g.moveTo(a,y);g.lineTo(a,y+h);g.stroke();}
  for(let j=0;j<=ny;j++){const a=Math.round(y+h*j/ny)+.5;g.beginPath();g.moveTo(x,a);g.lineTo(x+w,a);g.stroke();}
  g.strokeStyle=COL.rule; g.strokeRect(x+.5,y+.5,w,h); g.restore();
}
function tint(hex,a){
  const h=hex.replace('#',''), n=h.length===3?h.split('').map(c=>c+c).join(''):h;
  return `rgba(${parseInt(n.slice(0,2),16)},${parseInt(n.slice(2,4),16)},${parseInt(n.slice(4,6),16)},${a})`;
}
function RR(g,x,y,w,h,r){
  if(g.roundRect){g.beginPath();g.roundRect(x,y,w,h,r);return;}
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);

function SQ(g,x,y,s,o){
  o=o||{};
  const fill=(pts,c)=>{g.save();g.fillStyle=c;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);

  if(o.L)fill([[x,y],[x,y+s],[x+s,y+s]],o.L);
  if(o.U)fill([[x,y],[x+s,y],[x+s,y+s]],o.U);
  if(o.n){g.save();g.strokeStyle=tint(COL.faint,.28);g.lineWidth=1;
    for(let k=1;k<o.n;k++){const t=Math.round(s*k/o.n)+.5;
      g.beginPath();g.moveTo(x,y+t);g.lineTo(x+s,y+t);g.stroke();
      g.beginPath();g.moveTo(x+t,y);g.lineTo(x+t,y+s);g.stroke();}
    g.restore();}
  if(o.D){g.save();g.fillStyle=o.D;const c=s/(o.n||6);
    for(let k=0;k<(o.n||6);k++)g.fillRect(x+k*c,y+k*c,c,c);g.restore();}
  if(o.diag!==false){g.save();g.strokeStyle=o.diagCol||tint(COL.ink,.55);g.lineWidth=1.5;

function sorRho(w){
  const A=IT.A,n=3,D=mat.zeros(n,n),L=mat.zeros(n,n),U=mat.zeros(n,n);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    if(i===j)D[i][j]=A[i][j]; else if(i>j)L[i][j]=A[i][j]; else U[i][j]=A[i][j];}
  return rho(mat.mul(mat.inv(D.map((r,i)=>r.map((v,j)=>D[i][j]+w*L[i][j]))),
                     D.map((r,i)=>r.map((v,j)=>(1-w)*D[i][j]-w*U[i][j]))));
}

function fTraj(steps,i,method){

  const m1=Math.max(.04,(b1-a1)*.2), m2=Math.max(.04,(b2-a2)*.2);

    T(g,(a2+(b2-a2)*k/3).toFixed(2),x0-8,py(a2+(b2-a2)*k/3),COL.faint,11,'right',undefined,'o');}
  TM(g,'x₁',x0+W/2,y0+H+34,COL.dim,15,'center');
  g.save();g.translate(x0-40,y0+H/2);g.rotate(-Math.PI/2);TM(g,'x₂',0,0,COL.dim,15,'center');g.restore();
  if(isFinite(R)&&R<1&&A.length){

    for(let k=1;k<=4;k++){

    x0+8,y0+14,method==='J'?COL.u:COL.l,12.5,'left');

/* ---------- 線形代数 ---------- */
const mat={
  zeros:(n,m)=>Array.from({length:n},()=>new Array(m).fill(0)),
  eye:n=>{const A=mat.zeros(n,n);for(let i=0;i<n;i++)A[i][i]=1;return A;},
  mul:(A,B)=>{const n=A.length,m=B[0].length,p=B.length,R=mat.zeros(n,m);
    for(let i=0;i<n;i++)for(let k=0;k<p;k++){const a=A[i][k];if(a)for(let j=0;j<m;j++)R[i][j]+=a*B[k][j];}return R;},
  mv:(A,x)=>A.map(r=>r.reduce((s,v,j)=>s+v*x[j],0)),
  inv:A=>{const n=A.length,M=A.map((r,i)=>[...r,...mat.eye(n)[i]]);
    for(let c=0;c<n;c++){let p=c;
      for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
      if(Math.abs(M[p][c])<1e-14)return null;
      [M[c],M[p]]=[M[p],M[c]];
      const d=M[c][c];for(let j=0;j<2*n;j++)M[c][j]/=d;
      for(let r=0;r<n;r++)if(r!==c){const f=M[r][c];if(f)for(let j=0;j<2*n;j++)M[r][j]-=f*M[c][j];}}
    return M.map(r=>r.slice(n));},
  solve:(A,b)=>{const I=mat.inv(A);return I?mat.mv(I,b):null;},
  normInf:A=>Math.max(...A.map(r=>r.reduce((s,v)=>s+Math.abs(v),0)))
};
function rho(T){                       // log‖T^k‖ の傾き法（numpy と 8 桁一致）
  const n=T.length; let M=mat.eye(n),s=0,s1=0;
  const k1=120,k2=300;
  for(let k=1;k<=k2;k++){
    M=mat.mul(M,T); const nm=mat.normInf(M);
    if(nm===0)return 0; if(!isFinite(nm))return Infinity;
    s+=Math.log(nm); M=M.map(r=>r.map(v=>v/nm));
    if(k===k1)s1=s;
  }
  return Math.exp((s-s1)/(k2-k1));
}

function MX(rows,o){

  rows.forEach((r,i)=>{ t+='<tr>';
    r.forEach((v,j)=>{

      const sep=(o.sep!=null&&j===o.sep)?' sep':'';
      t+=`<td class="${c}${sep}">${typeof v==='number'?F(v,dp):v}</td>`;});
    t+='</tr>';});
  t+='</table></span>';

  const R=o.rnote?`<span class="rnote">${o.rnote.map(s=>`<span>${s||''}</span>`).join('')}</span>`:'';

    it.cells.forEach((v,j)=>{

const GE={A:[[2,1,-1],[-3,-1,2],[-2,1,2]], b:[8,-11,-3]};
function geSteps(){
  const M=GE.A.map((r,i)=>[...r,GE.b[i]]);
  const S=[];
  const snap=(hl,hl2,zero)=>mxHTML(M.map(r=>r.slice()),{
    dp:4, sep:3,
    cls:(i,j)=>{

      if(hl2&&hl2.some(([a,b])=>a===i&&b===j))return 'hl2';
      if(zero&&zero.some(([a,b])=>a===i&&b===j))return 'hl';
      if(j<3&&i>j&&Math.abs(M[i][j])<1e-12)return 'z';
      return '';}});
  S.push({phase:'準備',
    work:MOP(MX(M.map(r=>r.slice()),{dp:3,sep:3,rlab:RL,
      rnote:['','','']}),TAG('[ A | b ] 拡大係数行列'))
      +CALC('これから 0 にする成分',['a<sub>21</sub>, a<sub>31</sub>, a<sub>32</sub> の3つ（下三角）']),
    sym:'A x = b を拡大係数行列 [ A | b ] に書く',
    num:'2x₁ + x₂ − x₃ = 8 ／ −3x₁ − x₂ + 2x₃ = −11 ／ −2x₁ + x₂ + 2x₃ = −3',
    res:'これから左下の3つの成分をゼロにします（前進消去）',
    note:'手数は最初から決まっています。前進消去 n(n−1)/2 = 3手、後退代入 3手、合計6手。'});
  for(let k=0;k<2;k++)for(let i=k+1;i<3;i++){
    const m=M[i][k]/M[k][k], before=M[i].slice(), pk=M[k].slice();
    const B4=M.map(r=>r.slice());
    const sub=pk.map(v=>m*v);

    const rnote=[0,1,2].map(q=>q===k?'ピボット行':q===i?'これを消す':'');

    /* ① 乗数を決める */
    S.push({phase:`前進消去 ${(k*2+i)}／3 ・① 乗数`,
      work:MOP(MX(B4,{dp:3,sep:3,rlab:RL,rnote,cls:clsB}))
        +CALC('この2行だけを見る',[
          `ピボット a<sub>${k+1}${k+1}</sub> = ${F(pk[k],3)}　消したい a<sub>${i+1}${k+1}</sub> = ${F(before[k],3)}`,
          `m = a<sub>${i+1}${k+1}</sub> / a<sub>${k+1}${k+1}</sub> = ${P(before[k],3)} / ${F(pk[k],3)} = <b>${F(m,4)}</b>`]),
      sym:`m<sub>${i+1}${k+1}</sub> = a<sub>${i+1}${k+1}</sub> / a<sub>${k+1}${k+1}</sub>`,
      num:`m = ${P(before[k],4)} / ${F(pk[k],4)} = ${F(m,4)}`,
      res:`m<sub>${i+1}${k+1}</sub> = <span class="cO">${F(m,4)}</span>　この倍率でピボット行を引く`,
      note:`行${i+1}から「行${k+1}の ${F(m,4)} 倍」を引けば、a<sub>${i+1}${k+1}</sub> がちょうど 0 になります。`});

    /* ② 引く行を作る */
    S.push({phase:`前進消去 ${(k*2+i)}／3 ・② 引く行を作る`,
      work:LH([
        {lab:`r<sub>${k+1}</sub>`,cells:pk,cls:'pv'},
        {op:'×',lab:F(m,4),cells:['','','',''],cls:'mul'},
        {lab:`m·r<sub>${k+1}</sub>`,cells:sub,cls:'rule res',note:'← 引く行'}],{sep:3,dp:3})
        +CALC('ピボット行を m 倍する',
          [0,1,2,3].map(j=>`${j===3?'b':'a'}<sub>${k+1}${j===3?'':j+1}</sub> : ${F(m,4)} × ${P(pk[j],3)} = <b>${F(sub[j],3)}</b>`)),
      sym:`m<sub>${i+1}${k+1}</sub> · r<sub>${k+1}</sub>`,
      num:`${F(m,4)} × [ ${pk.map(v=>F(v,3)).join(', ')} ] = [ ${sub.map(v=>F(v,3)).join(', ')} ]`,
      res:`引く行 = [ ${sub.map(v=>F(v,3)).join(', ')} ]`,
      note:'まだ行列は変えていません。引く相手を用意しただけです。'});

    /* ③ 引いて置き換える */
    for(let j=0;j<4;j++)M[i][j]-=m*M[k][j];
    M[i][k]=0;
    const A4=M.map(r=>r.slice());
    S.push({phase:`前進消去 ${(k*2+i)}／3 ・③ 引く`,
      work:LH([
        {lab:`r<sub>${i+1}</sub>`,cells:before,hl:[k]},
        {op:'−',lab:`m·r<sub>${k+1}</sub>`,cells:sub,hl:[k]},
        {lab:`r<sub>${i+1}</sub> 新`,cells:after,cls:'rule res',hl:[k],note:'← 置き換え'}],{sep:3,dp:3})
        +MOP(ARW,MX(A4,{dp:3,sep:3,rlab:RL,cls:(a,b)=>a===i?(b===k?'hl':'row'):(a===k?'hl2':'')}))
        +CALC('成分ごとの引き算',

            (j===k?'　← 0 になった':''))),
      sym:`r<sub>${i+1}</sub> ← r<sub>${i+1}</sub> − m<sub>${i+1}${k+1}</sub> · r<sub>${k+1}</sub>`,

      note:`第${k+1}列の第${i+1}行が消えました。残りは ${3-(k*2+i)} 手です。`});
  }
  const x=[0,0,0];
  for(let i=2;i>=0;i--){

    x[i]=s/M[i][i];

      work:MOP(MX(M.map(r=>r.slice()),{dp:3,sep:3,rlab:RL,
          rnote:[0,1,2].map(q=>q===i?`この行を使う`:''),
          cls:(a,b)=>a===i?(b===i?'hl2':'row'):(a<i&&b<3&&b>a?'':(b<3&&a>b?'z':''))}),
        ARW,
        MX([[x[0]],[x[1]],[x[2]]],{dp:6,rlab:['x₁','x₂','x₃'],
          cls:r=>r===i?'hl':(r>i?'':'z')}))
        +CALC(`x<sub>${i+1}</sub> を求める`,cl2),
      sym:`x<sub>${i+1}</sub> = ( b<sub>${i+1}</sub> ${terms.length?'− Σ a<sub>'+(i+1)+'j</sub> x<sub>j</sub>':''} ) / a<sub>${i+1}${i+1}</sub>`,
      num:`x<sub>${i+1}</sub> = ( ${F(M[i][3],4)}${terms.length?' − '+terms.join(' − '):''} ) / ${F(M[i][i],4)}`,
      res:`x<sub>${i+1}</sub> = <span class="cO">${F(x[i],6)}</span>`,
      note:i===2?'上三角なので最下行は未知数が1つだけ。ここから上に戻ります。':''});
  }
  const chk=mat.mv(GE.A,x);
  S.push({phase:'検算',
    work:MOP(MX(GE.A,{dp:0,rlab:RL}),MX([[x[0]],[x[1]],[x[2]]],{dp:4,rlab:['x₁','x₂','x₃'],cls:()=>'hl'}),
      ARW,MX(chk.map(v=>[v]),{dp:4,cls:()=>'hl'}),TAG('= b'),MX(GE.b.map(v=>[v]),{dp:0})),
    sym:'A x = b になっているか確かめる',

    res:`x = ( ${x.map(v=>F(v,4)).join(', ')} )&nbsp;&nbsp;<span class="cO">6手で厳密解に到達</span>`,
    note:'反復法と違って、ここには「打ち切り誤差」がありません。残るのは丸め誤差だけです。'});
  return S;
}

const IT={A:[[8,-3,-2],[-3,9,-4],[-2,-4,10]], b:[1,2,-1], sweeps:5};
let itMethod='J';
function itSteps(){
  const A=IT.A,b=IT.b,n=3,w=+document.getElementById('itw').value;
  const xe=mat.solve(A,b);
  const D=mat.zeros(n,n),L=mat.zeros(n,n),U=mat.zeros(n,n);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    if(i===j)D[i][j]=A[i][j]; else if(i>j)L[i][j]=A[i][j]; else U[i][j]=A[i][j];}
  let T;
  if(itMethod==='J')T=mat.mul(mat.inv(D),D.map((r,i)=>r.map((v,j)=>-(L[i][j]+U[i][j]))));
  else if(itMethod==='GS')T=mat.mul(mat.inv(D.map((r,i)=>r.map((v,j)=>D[i][j]+L[i][j]))),U.map(r=>r.map(v=>-v)));
  else T=mat.mul(mat.inv(D.map((r,i)=>r.map((v,j)=>D[i][j]+w*L[i][j]))),
                 D.map((r,i)=>r.map((v,j)=>(1-w)*D[i][j]-w*U[i][j])));
  const R=rho(T);
  const err=x=>Math.max(...x.map((v,i)=>Math.abs(v-xe[i])));

  const S=[]; let x=[0,0,0], hist=[{x:[0,0,0],e:err([0,0,0]),ci:-1,sw:-1,end:true}];
  const Ab=A.map((r,i)=>[...r,b[i]]);

      rnote:[0,1,2].map(q=>q===row?`この行で x<sub>${row+1}</sub> を決める`:''),

        if(j===3)return i===row?'hl2':'';

  const xvec=(xs,hi,fresh)=>MX(xs.map(v=>[v]),{dp:6,rlab:['x₁','x₂','x₃'],
      rnote:[0,1,2].map(q=>q===hi?'← いま更新':(fresh&&fresh[q]?'今回値':'前回値')),
      cls:r=>r===hi?'hl':(fresh&&fresh[r]?'':'old')});
  const xpair=(xo,xn,hi,fresh)=>
      MX(xo.map(v=>[v]),{dp:6,rlab:['x₁','x₂','x₃'],cls:()=>'old'})
    + TAG('x⁽ᵏ⁾　右辺はこちらだけを見る') + ARW

        {rnote:[0,1,2].map(q=>q===hi?'← いま決まった':(fresh[q]?'決定済み':'まだ')),
         cls:r=>r===hi?'hl':(fresh[r]?'':'z')})
    + TAG('x⁽ᵏ⁺¹⁾　組み立て中');
  S.push({phase:'準備',
    work:MOP(mtx(-1),ARW,xvec(x,-1,[0,0,0]))
      +CALC('分割',['対角 D＝斜線、下三角 L、上三角 U に切り、左辺 M に入れる部分を決める']),
    sym:`<span class="cD">D</span> は対角、<span class="cL">L</span> は下三角、<span class="cU">U</span> は上三角`,
    num:{J:'M = <span class="cD">D</span>,&nbsp; N = −(<span class="cL">L</span>+<span class="cU">U</span>)',
         GS:'M = <span class="cD">D</span>+<span class="cL">L</span>,&nbsp; N = −<span class="cU">U</span>',
         SOR:`M = <span class="cD">D</span>/ω+<span class="cL">L</span>,&nbsp; N = (1/ω−1)<span class="cD">D</span>−<span class="cU">U</span>&nbsp;&nbsp;(ω=${w})`}[itMethod],
    res:`ρ(T) = <span class="${R<1?'cO':'cN'}">${F(R,6)}</span>&nbsp;→&nbsp;${R<1?'収束します':'発散します'}　厳密解 x* = ( ${xe.map(v=>F(v,6)).join(', ')} )`,
    note:'初期値は x⁽⁰⁾ = 0。ここから1成分ずつ更新していきます。'});

  for(let s=0;s<IT.sweeps;s++){
    const xo=x.slice(), fresh=[0,0,0];
    const xn=x.slice();                       // ヤコビ：組み立て中の新ベクトル
    for(let i=0;i<n;i++){
      const src = itMethod==='J' ? xo : x;
      const isJ = itMethod==='J';
      const used=[0,1,2].filter(j=>j!==i);
      const sum=used.reduce((t,j)=>t+A[i][j]*src[j],0);
      const raw=(b[i]-sum)/A[i][i];
      const prev=x[i];
      const nv = itMethod==='SOR' ? prev + w*(raw-prev) : raw;

      /* ① 対角以外の項を計算する */
      S.push({phase:`掃引 ${s+1}・x${i+1} ①`,
        work:MOP(mtx(i))+'<div style="margin-top:8px">'+
          (isJ?MOP(xpair(xo,xn,-1,fresh)):MOP(xvec(x,-1,fresh)))+'</div>'+LH(
          used.map(j=>({lab:`a<sub>${i+1}${j+1}</sub> x<sub>${j+1}</sub>`,
            cells:[Pi(A[i][j]),'×',F(src[j],6),'=',F(A[i][j]*src[j],6)],
            note:isJ?'<span class="cM">x⁽ᵏ⁾ から</span>'
                    :(fresh[j]?'<span class="cO">今回値</span>':'<span class="cM">前回値</span>')}))
          .concat([{lab:'合計',cells:['','','','=',F(sum,6)],cls:'rule res'}]),{dp:6}),
        sym:`${used.map(j=>`a<sub>${i+1}${j+1}</sub>x<sub>${j+1}</sub>`).join(' + ')} を先に計算する`,
        num:used.map(j=>`${Pi(A[i][j])}×<span class="${isJ?'cM':(fresh[j]?'cO':'cM')}">${P(src[j],6)}</span>`).join(' + ')+` = ${F(sum,6)}`,
        res:`対角以外の合計 = <span class="cO">${F(sum,6)}</span>`,
        note: isJ
          ? '<b>ヤコビ法では、右辺の x はすべて左の x⁽ᵏ⁾ から取ります。</b>この掃引ですでに決まった値があっても使いません。だから3成分の計算は互いに独立で、並列に走らせられます。'
          : (i===0?'ガウス・ザイデルは1本のベクトルをその場で書き換えます。掃引の1成分目なので、参照する x はまだ前回値です。'
                 :'<b>この掃引で更新済みの<span class="cO">今回値</span>をそのまま使います。</b>ここがヤコビとの唯一の違いです。'),
        hist:hist.slice()});

      /* ② 割って確定する */
      const cl=[`b<sub>${i+1}</sub> − 合計 = ${Pi(b[i])} − ${P(sum,6)} = <b>${F(b[i]-sum,6)}</b>`,
        `÷ a<sub>${i+1}${i+1}</sub> = ${F(b[i]-sum,6)} / ${A[i][i]} = <b>${F(raw,6)}</b>`]
        .concat(itMethod==='SOR'?[`緩和 : ${F(prev,6)} + ${w} × ( ${F(raw,6)} − ${F(prev,6)} ) = <b>${F(nv,6)}</b>`]:[])
        .concat(isJ?['<span class="cM">x⁽ᵏ⁾ はまだ書き換えない。掃引の終わりにまとめて入れ替える。</span>']:[]);
      fresh[i]=1;
      if(isJ){ xn[i]=nv; }
      else { x=x.slice(); x[i]=nv; hist.push({x:x.slice(),e:err(x),ci:i,sw:s,end:i===n-1}); }
      S.push({phase:`掃引 ${s+1}・x${i+1} ②`,
        work:(isJ?MOP(xpair(xo,xn,i,fresh))
                 :MOP(xvec(x,i,fresh),TAG(`誤差 ${hist[hist.length-1].e.toExponential(3)}`)))
             +CALC('割って確定する',cl),
        sym: itMethod==='SOR'
          ? `x̃<sub>${i+1}</sub> = ( b<sub>${i+1}</sub> − 合計 ) / a<sub>${i+1}${i+1}</sub>　→　x<sub>${i+1}</sub> ← x<sub>${i+1}</sub> + ω( x̃<sub>${i+1}</sub> − x<sub>${i+1}</sub> )`
          : (isJ?`x<sub>${i+1}</sub><sup>(k+1)</sup> = ( b<sub>${i+1}</sub> − 合計 ) / a<sub>${i+1}${i+1}</sub>`
                :`x<sub>${i+1}</sub> ← ( b<sub>${i+1}</sub> − 合計 ) / a<sub>${i+1}${i+1}</sub>`),
        num:`( ${Pi(b[i])} − ${P(sum,6)} ) / ${A[i][i]} = ${F(raw,6)}`+
          (itMethod==='SOR'?`　→　${F(prev,6)} + ${w}×(${F(raw,6)} − ${F(prev,6)}) = ${F(nv,6)}`:''),
        res:`x<sub>${i+1}</sub>${isJ?'<sup>(k+1)</sup>':''} = <span class="cO">${F(nv,6)}</span>　（前回 ${F(prev,6)}、変化 ${SG(nv-prev,6)}）`,
        note:isJ?`右の列に ${i+1} 個目が入りました。左の x⁽ᵏ⁾ は動いていません。`
                :`成分 ${i+1} だけが動きました。他の2つはこの手では変わりません。`,
        hist:hist.slice()});
    }
    /* ヤコビ：掃引の終わりに一括で入れ替える */
    if(itMethod==='J'){
      x=xn.slice();
      hist.push({x:x.slice(),e:err(x),ci:2,sw:s,end:true});
      S.push({phase:`掃引 ${s+1}・入れ替え`,
        work:MOP(MX(xo.map(v=>[v]),{dp:6,rlab:['x₁','x₂','x₃'],cls:()=>'old'}),
              TAG('x⁽ᵏ⁾'),ARW,
              MX(x.map(v=>[v]),{dp:6,rlab:['x₁','x₂','x₃'],cls:()=>'hl'}),
              TAG('x⁽ᵏ⁺¹⁾'),TAG(`誤差 ${hist[hist.length-1].e.toExponential(3)}`))
          +CALC('3成分をまとめて入れ替える',[
            `x⁽ᵏ⁺¹⁾ = ( ${x.map(v=>F(v,6)).join(' , ')} )`,
            '<span class="cM">3つの計算は互いに独立だったので、順番を変えても結果は同じ。並列計算機に向く理由です。</span>']),
        sym:'x<sup>(k+1)</sup> ← 組み立てた新しいベクトル',
        num:`( ${xo.map(v=>F(v,4)).join(' , ')} ) → ( ${x.map(v=>F(v,4)).join(' , ')} )`,
        res:`掃引 ${s+1} 完了　誤差 <span class="cO">${hist[hist.length-1].e.toExponential(3)}</span>`,
        note:'<b>ここで初めて x が動きます。</b>ガウス・ザイデルは成分ごとに動いていたので、同じ掃引数でも誤差に差が出ます。',
        hist:hist.slice()});
    }
  }
  S.forEach(st=>{if(!st.hist)st.hist=[hist[0]];});
  S.rho=R; S.xe=xe; S.hist=hist;
  return S;
}

const PF={r:0.02,x:0.10,V1:1.0,Q:-0.40,Pnose:3.752};
function yb(){const d=PF.r*PF.r+PF.x*PF.x;return{g:PF.r/d,b:-PF.x/d};}
function pq(d2,v2){
  const {g,b}=yb(), G=[[g,-g],[-g,g]], B=[[b,-b],[-b,b]], V=[PF.V1,v2], th=[0,d2];
  let Pp=0,Qq=0;
  for(let k=0;k<2;k++){const dt=th[1]-th[k];
    Pp+=V[1]*V[k]*(G[1][k]*Math.cos(dt)+B[1][k]*Math.sin(dt));
    Qq+=V[1]*V[k]*(G[1][k]*Math.sin(dt)-B[1][k]*Math.cos(dt));}
  return [Pp,Qq];
}
function jac(d,v){
  const {g,b}=yb(), g22=g,b22=b,g21=-g,b21=-b;
  return [[-v*PF.V1*(g21*Math.sin(d)-b21*Math.cos(d)), 2*v*g22+PF.V1*(g21*Math.cos(d)+b21*Math.sin(d))],
          [ v*PF.V1*(g21*Math.cos(d)+b21*Math.sin(d)),-2*v*b22+PF.V1*(g21*Math.sin(d)-b21*Math.cos(d))]];
}
function nrSteps(){
  const Psp=-(+document.getElementById('nrpl').value);
  const S=[]; let d=0,v=1, hist=[];
  const xv=(dd,vv,hi)=>mxHTML([[`δ₂ = ${F(dd*180/Math.PI,5)}°`],[`V₂ = ${F(vv,7)}`]],
      {cls:r=>hi?'hl':''});
  const [P0,Q0]=pq(0,1);
  hist.push(Math.max(Math.abs(Psp-P0),Math.abs(PF.Q-Q0)));
  S.push({phase:'準備',
    work:lab('x⁽⁰⁾ =')+xv(0,1,0)+lab('指定値')+
      mxHTML([[`P₂ = ${F(Psp,3)}`],[`Q₂ = ${F(PF.Q,3)}`]],{}),
    sym:'未知数 x = ( δ₂ , V₂ )、方程式 f(x) = [ P₂<sup>指定</sup> − P₂(x) , Q₂<sup>指定</sup> − Q₂(x) ]',
    num:'初期値はフラットスタート δ₂ = 0°、V₂ = 1.0 pu',
    res:'1反復を5つの手に分けます：① 残差 → ② ヤコビアン → ③ 逆行列 → ④ Δx → ⑤ 更新',
    note:'③ が Ax=b そのもの。ニュートン法は、非線形方程式を「線形方程式を何度も解く」問題に翻訳する手続きです。',
    hist:hist.slice(), d:0, v:1});
  for(let it=0;it<6;it++){
    const [Pc,Qc]=pq(d,v), f=[Psp-Pc,PF.Q-Qc], J=jac(d,v);
    const det=J[0][0]*J[1][1]-J[0][1]*J[1][0];
    const dx=mat.solve(J,f);
    const mis=Math.max(Math.abs(f[0]),Math.abs(f[1]));
    if(!isFinite(mis)||Math.abs(v)>5||v<0.02){
      S.push({phase:'発散',work:'',sym:'',num:'',
        res:'<span class="cN">反復が発散しました</span>',
        note:'負荷率が 100% を超えています。上枝と下枝が合流して<b>解そのものが消滅</b>しているため、どんな反復法でも到達できません。',
        hist:hist.slice(),d,v,dead:1});
      break;
    }
    S.push({phase:`反復 ${it+1}・① 残差`,
      work:MOP(MX([[`δ₂ = ${F(d*180/Math.PI,5)}°`],[`V₂ = ${F(v,7)}`]],{rlab:['','']}),ARW,
        MX([[f[0]],[f[1]]],{dp:8,rlab:['ΔP','ΔQ'],cls:()=>'hl3'}))
        +CALC('指定値と計算値の差',[
          `ΔP = P₂<sup>指定</sup> − P₂(x) = ${F(Psp,4)} − ${P(Pc,8)} = <b>${F(f[0],8)}</b>`,
          `ΔQ = Q₂<sup>指定</sup> − Q₂(x) = ${F(PF.Q,4)} − ${P(Qc,8)} = <b>${F(f[1],8)}</b>`]),
      sym:'f(x) = [ P₂<sup>指定</sup> − P₂(δ₂,V₂) , Q₂<sup>指定</sup> − Q₂(δ₂,V₂) ]',
      num:`P₂(x) = ${F(Pc,8)} ／ Q₂(x) = ${F(Qc,8)}<br>`+
          `f = [ ${F(Psp,4)} − ${P(Pc,8)} , ${F(PF.Q,4)} − ${P(Qc,8)} ]`,
      res:`f = ( ${F(f[0],8)} , ${F(f[1],8)} )　残差 ‖f‖<sub>∞</sub> = <span class="cO">${mis.toExponential(3)}</span>`,
      note:it===0?'いまの推定値をAC潮流方程式に入れて、指定値とのズレを測ります。ここがゼロになれば解です。':'',
      hist:hist.slice(),d,v});
    S.push({phase:`反復 ${it+1}・② ヤコビアン`,
      work:MOP(MX(J,{dp:5,rlab:['∂P/','∂Q/'],rnote:['∂δ₂　∂V₂',''],cls:(a,b)=>a===b?'hl2':'row'}),
        TAG(`det J = ${F(det,5)}`))
        +CALC('4つの偏微分',[
          `H = ∂P₂/∂δ₂ = <b>${F(J[0][0],5)}</b>　（大：P は角度で動く）`,
          `N = ∂P₂/∂V₂ = <b>${F(J[0][1],5)}</b>`,
          `M = ∂Q₂/∂δ₂ = <b>${F(J[1][0],5)}</b>`,
          `L = ∂Q₂/∂V₂ = <b>${F(J[1][1],5)}</b>　（大：Q は電圧で動く）`]),
      sym:'J = [ ∂P₂/∂δ₂ &nbsp; ∂P₂/∂V₂ ; &nbsp; ∂Q₂/∂δ₂ &nbsp; ∂Q₂/∂V₂ ]',
      num:`H = ${F(J[0][0],5)} ／ N = ${F(J[0][1],5)} ／ M = ${F(J[1][0],5)} ／ L = ${F(J[1][1],5)}`,
      res:`det J = <span class="${Math.abs(det)<20?'cN':'cO'}">${F(det,5)}</span>`,
      note:it===0?'いまの動作点での傾き。det J が 0 に近づくほど、次の Δx が暴れます。電圧安定限界では det J → 0。':'',
      hist:hist.slice(),d,v});
    const iJ=[[J[1][1]/det,-J[0][1]/det],[-J[1][0]/det,J[0][0]/det]];
    S.push({phase:`反復 ${it+1}・③ 逆行列を作る`,
      work:MOP(MX(J,{dp:4,rlab:['',''],cls:(a,b)=>a===b?'hl2':'row'}),ARW,
        MX(iJ,{dp:6,cls:()=>'hl'}),TAG('J⁻¹'))
        +CALC('2×2 の逆行列',[
          `det J = H·L − N·M = ${P(J[0][0],4)} × ${P(J[1][1],4)} − ${P(J[0][1],4)} × ${P(J[1][0],4)} = <b>${F(det,5)}</b>`,
          `J⁻¹ = (1/det) [ L  −N ; −M  H ] = (1/${F(det,4)}) [ ${P(J[1][1],4)}  ${P(-J[0][1],4)} ; ${P(-J[1][0],4)}  ${P(J[0][0],4)} ]`,
          `det が小さいほど J⁻¹ が大きくなり、次の一歩が暴れる。`]),
      sym:`J<sup>−1</sup> = <span style="font-size:.9em">(1/det J) [ L &nbsp;−N ; &nbsp;−M &nbsp;H ]</span>`,
      num:`det J = ${F(det,5)}`,
      res:`det J = <span class="${Math.abs(det)<20?'cN':'cO'}">${F(det,5)}</span>　${Math.abs(det)<20?'かなり小さい（限界が近い）':''}`,
      note:'ここが LEVEL 01 の Ax = b。実系統では 2×2 ではなく数万次元になるので、逆行列は作らず疎行列LU分解で解きます。',
      hist:hist.slice(),d,v});
    S.push({phase:`反復 ${it+1}・④ Δx を得る`,
      work:MOP(MX(iJ,{dp:6}),MX([[f[0]],[f[1]]],{dp:6,rlab:['ΔP','ΔQ']}),ARW,
        MX([[dx[0]],[dx[1]]],{dp:8,rlab:['Δδ₂','ΔV₂'],cls:()=>'hl'}))
        +CALC('掛けるだけ',[
          `Δδ₂ = ${P(iJ[0][0],6)} × ${P(f[0],6)} + ${P(iJ[0][1],6)} × ${P(f[1],6)} = <b>${F(dx[0],8)}</b> rad = ${F(dx[0]*180/Math.PI,5)}°`,
          `ΔV₂ = ${P(iJ[1][0],6)} × ${P(f[0],6)} + ${P(iJ[1][1],6)} × ${P(f[1],6)} = <b>${F(dx[1],8)}</b> pu`]),
      sym:`Δx = J<sup>−1</sup> f(x)`,
      num:`Δδ₂ = ${F(dx[0],8)} rad、 ΔV₂ = ${F(dx[1],8)} pu`,
      res:`Δδ₂ = <span class="cO">${F(dx[0]*180/Math.PI,5)}°</span>　ΔV₂ = <span class="cO">${F(dx[1],8)} pu</span>`,
      note:'これが「次にどれだけ動くか」。まだ x は更新していません。',
      hist:hist.slice(),d,v});
    const nd=d+dx[0], nv=v+dx[1];
    const [Pn,Qn]=pq(nd,nv);
    const nmis=Math.max(Math.abs(Psp-Pn),Math.abs(PF.Q-Qn));
    hist.push(nmis);
    S.push({phase:`反復 ${it+1}・⑤ 更新`,
      work:MOP(MX([[F(d*180/Math.PI,5)+'°'],[F(v,7)]],{rlab:['δ₂','V₂']}),TAG('+'),
        MX([[dx[0]*180/Math.PI],[dx[1]]],{dp:5,cls:()=>'hl2'}),ARW,
        MX([[F(nd*180/Math.PI,5)+'°'],[F(nv,7)]],{rlab:['δ₂','V₂'],cls:()=>'hl'}))
        +CALC('足すだけ',[
          `δ₂ = ${F(d*180/Math.PI,5)}° ${SG(dx[0]*180/Math.PI,5)}° = <b>${F(nd*180/Math.PI,5)}°</b>`,
          `V₂ = ${F(v,7)} ${SG(dx[1],7)} = <b>${F(nv,7)}</b> pu`,
          `残差 ${mis.toExponential(3)} → <b>${nmis.toExponential(3)}</b>`]),
      sym:'x⁽ᵏ⁺¹⁾ = x⁽ᵏ⁾ + Δx',
      num:`δ₂ = ${F(d*180/Math.PI,5)}° ${SG(dx[0]*180/Math.PI,5)}°　／　V₂ = ${F(v,7)} ${SG(dx[1],7)}`,
      res:`δ₂ = <span class="cO">${F(nd*180/Math.PI,5)}°</span>　V₂ = <span class="cO">${F(nv,7)} pu</span>　新しい残差 ${nmis.toExponential(3)}`,
      note:`残差が ${mis.toExponential(1)} → ${nmis.toExponential(1)}。`+
           (it>0?'桁数がおよそ倍になっているのが2次収束です。':'2次収束は次の反復からはっきり出ます。'),
      hist:hist.slice(),d:nd,v:nv});
    d=nd; v=nv;
    if(nmis<1e-12){
      S.push({phase:'収束',
        work:lab('解')+xv(d,v,1),
        sym:'‖f(x)‖ < 許容値 → 停止',
        num:`反復 ${it+1} 回で収束`,
        res:`V₂ = <span class="cO">${F(v,8)} pu</span>　δ₂ = <span class="cO">${F(d*180/Math.PI,6)}°</span>`,
        note:'反復回数は負荷条件をかなり変えてもほとんど増えません。これが2次収束の実用上の意味です。',
        hist:hist.slice(),d,v});
      break;
    }
  }
  S.Psp=Psp;
  return S;
}

const SW={H:3.5,f0:60,Pm:0.8,Pf:0.4,Ppost:1.3,dt:0.05,N:30};
const MM=()=>2*SW.H/(2*Math.PI*SW.f0);
function odeSteps(){
  const tc=+document.getElementById('odetc').value, M=MM();
  const Pmax=t=>t<tc-1e-9?SW.Pf:SW.Ppost;
  const f=(t,d,w)=>[w,(SW.Pm-Pmax(t)*Math.sin(d))/M];
  const d0=Math.asin(SW.Pm/1.8);
  const S=[];
  let r=[d0,0], e=[d0,0], t=0;
  const tr=[[0,d0]], tre=[[0,d0]];
  const deg=x=>F(x*180/Math.PI,4);
  S.push({phase:'準備',
    work:lab('状態 x =')+mxHTML([[`δ = ${deg(d0)}°`],[`ω = 0.000000 rad/s`]],{})+
         lab(`Δt = ${SW.dt} s`)+lab(`M = ${F(M,6)}`),
    sym:'dδ/dt = ω,&nbsp; dω/dt = ( P<sub>m</sub> − P<sub>max</sub>(t) sin δ ) / M',
    num:`初期平衡点 δ₀ = arcsin( P<sub>m</sub> / P<sub>max</sub><sup>故障前</sup> ) = arcsin( 0.8 / 1.8 ) = ${deg(d0)}°`,
    res:`t = 0 で故障発生。P<sub>max</sub> が 1.8 → <span class="cN">0.4</span> に落ち、t = ${tc} s で <span class="cO">1.3</span> に復帰します。`,
    note:'同じ Δt で RK4 と前進オイラーを並走させます。1手＝1タイムステップ。',
    tr:[[0,d0]],tre:[[0,d0]],t:0});
  for(let n=0;n<SW.N;n++){
    const k1=f(t,r[0],r[1]);
    const k2=f(t+SW.dt/2,r[0]+SW.dt/2*k1[0],r[1]+SW.dt/2*k1[1]);
    const k3=f(t+SW.dt/2,r[0]+SW.dt/2*k2[0],r[1]+SW.dt/2*k2[1]);
    const k4=f(t+SW.dt,r[0]+SW.dt*k3[0],r[1]+SW.dt*k3[1]);
    const nr=[r[0]+SW.dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]),
              r[1]+SW.dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1])];
    const ke=f(t,e[0],e[1]);
    const ne=[e[0]+SW.dt*ke[0], e[1]+SW.dt*ke[1]];
    const sw = (t<tc-1e-9)&&(t+SW.dt>=tc-1e-9);
    const kt=[['k₁','始点 t',k1],['k₂','中点（k₁で仮進み）',k2],['k₃','中点（k₂で仮進み）',k3],['k₄','終点（k₃で仮進み）',k4]];
    const tbl='<table class="tb" style="margin:0;font-size:12px"><tr><th>傾き</th><th>測る位置</th>'+
      '<th class="n">dδ/dt</th><th class="n">dω/dt</th></tr>'+
      kt.map(([a,b,k])=>`<tr><td class="m">${a}</td><td class="dimtx">${b}</td>`+
        `<td class="n">${F(k[0],5)}</td><td class="n">${F(k[1],4)}</td></tr>`).join('')+'</table>';
    S.push({phase:`t = ${F(t,2)} → ${F(t+SW.dt,2)} s`,
      work:tbl,
      sym:'k₁ = f(t, x)、k₂ = f(t+Δt/2, x+Δt/2·k₁)、k₃ = f(t+Δt/2, x+Δt/2·k₂)、k₄ = f(t+Δt, x+Δt·k₃)<br>'+
          'x ← x + (Δt/6)( k₁ + 2k₂ + 2k₃ + k₄ )',
      num:`δ ← ${F(r[0],6)} + (${SW.dt}/6)( ${F(k1[0],4)} + 2×${F(k2[0],4)} + 2×${F(k3[0],4)} + ${F(k4[0],4)} ) = ${F(nr[0],6)} rad<br>`+
          `<span class="cM">オイラー：δ ← ${F(e[0],6)} + ${SW.dt} × ${F(ke[0],4)} = ${F(ne[0],6)} rad</span>`,
      res:`<span class="cO">RK4：δ = ${deg(nr[0])}°</span>　`+
          `<span class="cN">オイラー：δ = ${deg(ne[0])}°</span>　オイラーのずれ ${SG((ne[0]-nr[0])*180/Math.PI,3)}°`,
      note: sw?`<b>この手で故障が除去されます。</b>P<sub>max</sub> が 0.4 → 1.3 に不連続に変わるため、Δt の切れ目を t<sub>c</sub> に合わせないと誤差が入ります。`
              :(n===0?'k₂ と k₃ は「中点まで仮に進んでみて測った傾き」。1手の中で4回微分を計算するので、コストはオイラーの4倍です。':''),
      tr:[...tr,[t+SW.dt,nr[0]]], tre:[...tre,[t+SW.dt,ne[0]]], t:t+SW.dt,
      t0:t, d0:r[0], e0:e[0], k1,k2,k3,k4, dNew:nr[0], eNew:ne[0]});
    tr.push([t+SW.dt,nr[0]]); tre.push([t+SW.dt,ne[0]]);
    r=nr; e=ne; t+=SW.dt;
    if(r[0]>Math.PI*1.5)break;
  }
  S.tc=tc;
  return S;
}

const ED={c:[0.001562,0.00194,0.00482], b:[7.92,7.85,7.97],
          Pmin:[150,100,50], Pmax:[600,400,200], name:['G1','G2','G3']};
const edEq=D=>{
  const s1=ED.c.reduce((s,c)=>s+1/(2*c),0), s2=ED.b.reduce((s,b,i)=>s+b/(2*ED.c[i]),0);
  const lam=(D+s2)/s1;
  return {lam,P:ED.b.map((b,i)=>(lam-b)/(2*ED.c[i]))};
};
const totalCost=Pv=>Pv.reduce((s,p,i)=>s+ED.b[i]*p+ED.c[i]*p*p,0);

function lamSteps(){
  const D=+document.getElementById('dem2').value;
  document.getElementById('dem2v').textContent=D;
  let lo=7.80, hi=12.0;
  const S=[];
  const clip=lam=>ED.b.map((b,k)=>{
    const raw=(lam-b)/(2*ED.c[k]);
    return {raw, P:Math.max(ED.Pmin[k],Math.min(ED.Pmax[k],raw)),
            at: raw>ED.Pmax[k]?'max': raw<ED.Pmin[k]?'min':null};});
  const tbl=r=>'<table class="tb" style="margin:0;font-size:12px">'+
    '<tr><th>機</th><th class="n">(λ−b)/2c</th><th class="n">クリップ後 P</th><th>状態</th></tr>'+
    r.map((x,i)=>`<tr><td>${ED.name[i]}</td><td class="n">${F(x.raw,2)}</td>`+
      `<td class="n" style="color:${x.at?COL.ng:COL.ok}">${F(x.P,2)}</td>`+
      `<td>${x.at?`<span class="tag on">${x.at==='max'?'上限 '+ED.Pmax[i]:'下限 '+ED.Pmin[i]}で固定</span>`
                 :'<span class="tag free">内点（μ=0）</span>'}</td></tr>`).join('')+'</table>';
  S.push({phase:'準備',
    work:tbl(clip((lo+hi)/2)),
    sym:'停留性 dF<sub>i</sub>/dP<sub>i</sub> = λ を P<sub>i</sub> について解き、上下限でクリップする',
    num:`P<sub>i</sub> = clip( (λ − b<sub>i</sub>) / 2c<sub>i</sub> , P<sub>i</sub><sup>min</sup> , P<sub>i</sub><sup>max</sup> )`,
    res:`λ の探索区間 [ ${F(lo,3)} , ${F(hi,3)} ] から始めます。需要 D = ${D} MW`,
    note:'クリップこそが KKT の相補性条件そのものです。内点なら μ=0、境界に張り付いたら μ>0。どちらになるかは λ が決まるまで分かりません。',
    lam:(lo+hi)/2, r:clip((lo+hi)/2), D});
  let lam=0,r=[];
  for(let k=0;k<16;k++){
    lam=(lo+hi)/2; r=clip(lam);
    const sum=r.reduce((s,x)=>s+x.P,0);
    const low=sum<D;
    S.push({phase:`二分探索 ${k+1}手目`,
      work:tbl(r),
      sym:'λ ← ( λ<sub>lo</sub> + λ<sub>hi</sub> ) / 2　→　各機の P を計算　→　ΣP と D を比べる',
      num:`λ = ( ${F(lo,6)} + ${F(hi,6)} ) / 2 = <span class="cD">${F(lam,6)}</span><br>`+
          r.map((x,i)=>`P<sub>${i+1}</sub> = clip( (${F(lam,4)} − ${ED.b[i]}) / ${F(2*ED.c[i],5)} ) = ${F(x.P,2)}`).join('　／　'),
      res:`ΣP = ${F(sum,2)} MW &nbsp;<span class="${low?'cN':'cD'}">${low?'&lt;':'&gt;'}</span>&nbsp; D = ${D} MW`+
          `&nbsp;→&nbsp;<span class="cO">${low?'発電が足りない ⇒ λ を上げる':'発電が過剰 ⇒ λ を下げる'}</span>`,
      note:`区間を [ ${F(low?lam:lo,4)} , ${F(low?hi:lam,4)} ] に半分に狭めます。`+
           (r.some(x=>x.at)?'　上下限に当たった機が出ました。その機は以降 λ の決定に参加しません。':''),
      lam,r,D});
    if(low)lo=lam; else hi=lam;
  }
  const mu=r.map((x,i)=>{
    const ic=ED.b[i]+2*ED.c[i]*x.P;
    return x.at==='max'?{v:lam-ic,t:'max'}:x.at==='min'?{v:ic-lam,t:'min'}:{v:0,t:null};});
  S.push({phase:'仕上げ・μ の計算',
    work:tbl(r)+'<table class="tb" style="margin:8px 0 0;font-size:12px">'+
      '<tr><th>機</th><th class="n">dF/dP</th><th class="n">λ</th><th class="n">μ = λ − dF/dP</th><th>相補性 μg = 0</th></tr>'+
      r.map((x,i)=>{const ic=ED.b[i]+2*ED.c[i]*x.P, a=mu[i].v>1e-6;
        return `<tr${a?' class="hi"':''}><td>${ED.name[i]}</td><td class="n">${F(ic,4)}</td>`+
          `<td class="n">${F(lam,4)}</td><td class="n" style="color:${a?COL.ng:COL.faint}">${F(mu[i].v,4)}</td>`+
          `<td>${a?'<span class="tag on">g = 0 なので μ &gt; 0</span>':'<span class="tag free">g &lt; 0 なので μ = 0</span>'}</td></tr>`;}).join('')+'</table>',
    sym:'停留性 dF<sub>i</sub>/dP<sub>i</sub> − λ + μ<sub>i</sub><sup>max</sup> − μ<sub>i</sub><sup>min</sup> = 0 から μ を逆算する',
    num:mu.map((m,i)=>m.t?`μ<sub>${i+1}</sub> = λ − dF<sub>${i+1}</sub>/dP = ${F(lam,4)} − ${F(ED.b[i]+2*ED.c[i]*r[i].P,4)} = ${F(m.v,4)}`
                        :`μ<sub>${i+1}</sub> = 0（内点）`).join('　／　'),
    res:`λ = <span class="cO">${F(lam,4)} $/MWh</span>　有効制約 ${mu.filter(m=>m.v>1e-6).length} 個　総費用 ${F(totalCost(r.map(x=>x.P)),0)} $/h`,
    note:'μ の意味は「その機の上限を 1 MW 緩めたら総費用がいくら下がるか」。制約の値段です。m 個の不等式があれば有効/非有効の組合せは 2ᵐ 通り。ここでは 3 機なので探索で済みますが、これが次の段で壁になります。',
    lam,r,D,mu});
  return S;
}

let cxMode='cvx';
const fC =x=>0.16*(x-4.2)*(x-4.2)+0.5;
const fN =x=>0.16*(x-4.2)*(x-4.2)+1.05*Math.sin(1.55*x)+1.2;
const GD={alpha:0.6,N:30};
function gdSteps(){
  const F_=cxMode==='cvx'?fC:fN;
  const df=x=>(F_(x+1e-6)-F_(x-1e-6))/2e-6;
  const d2=x=>(F_(x+1e-3)-2*F_(x)+F_(x-1e-3))/1e-6;
  let hmin=1e9,hmax=-1e9;
  for(let k=0;k<=400;k++){const x=-1+12*k/400;hmin=Math.min(hmin,d2(x));hmax=Math.max(hmax,d2(x));}
  let x=+document.getElementById('gdx0').value;
  const S=[], tr=[x];
  S.push({phase:'準備',
    work:lab('f(x) =')+`<span class="mxlab">${cxMode==='cvx'?'0.16(x−4.2)² + 0.5':'0.16(x−4.2)² + 1.05 sin(1.55x) + 1.2'}</span>`,
    sym:'x ← x − α f′(x)　（最急降下法、α = '+GD.alpha+'）',
    num:`x₀ = ${F(x,4)}、f(x₀) = ${F(F_(x),5)}、f′(x₀) = ${F(df(x),5)}`,
    res:`∇²f の最小値 = <span class="${hmin>=0?'cO':'cN'}">${F(hmin,3)}</span>&nbsp;→&nbsp;`+
        (hmin>=0?'どこでも半正定値 ⇒ <span class="cO">凸関数</span>':'負になる区間がある ⇒ <span class="cN">非凸</span>'),
    note:hmin>=0?'凸なら KKT 条件は十分条件になり、見つけた停留点が大域最適だと保証されます。'
                :'非凸だと KKT は必要条件どまり。停留点が見つかっても、それが最良かどうかは分かりません。',
    x,tr:[x],hmin});
  for(let k=0;k<GD.N;k++){
    const g=df(x), nx=x-GD.alpha*g;
    tr.push(nx);
    S.push({phase:`降下 ${k+1}手目`,
      work:lab('x =')+mxHTML([[x]],{dp:5,cls:()=>'hl2'})+lab('f′(x) =')+
           mxHTML([[g]],{dp:5,cls:()=>Math.abs(g)<1e-4?'hl':'hl3'})+
           lab('f(x) =')+mxHTML([[F_(x)]],{dp:5}),
      sym:'x ← x − α f′(x)',
      num:`x ← ${F(x,5)} − ${GD.alpha} × ${P(g,5)} = ${F(nx,5)}`,
      res:`x = <span class="cO">${F(nx,5)}</span>、f(x) = <span class="cO">${F(F_(nx),5)}</span>`+
          (Math.abs(g)<1e-4?'　<span class="cO">勾配がほぼ 0 ⇒ 停留点</span>':''),
      note:k===0?'勾配の符号と逆に進みます。歩幅 α が大きすぎると発散、小さすぎると進まない。'
                :(Math.abs(g)<1e-4?(hmin>=0?'凸なのでこれが大域最適です。':'停留点に着きましたが、これが大域最適とは限りません。開始点を変えてみてください。'):''),
      x:nx,tr:tr.slice(),hmin});
    x=nx;
    if(Math.abs(g)<1e-7)break;
  }
  return S;
}

const UC={F:[500,300,100], b:[8,10,15], Pmin:[100,50,20], Pmax:[400,250,100], name:['A','B','C']};
function ucBound(D,fix){
  const Pv=[0,0,0]; let cost=0,R=D;
  [0,1,2].forEach(i=>{if(fix[i]===1){cost+=UC.F[i];Pv[i]=UC.Pmin[i];cost+=UC.b[i]*UC.Pmin[i];R-=UC.Pmin[i];}});
  if(R<-1e-9)return null;
  const seg=[];
  [0,1,2].forEach(i=>{
    if(fix[i]===1)seg.push({i,p:UC.b[i],h:UC.Pmax[i]-UC.Pmin[i]});
    else if(fix[i]===null)seg.push({i,p:UC.b[i]+UC.F[i]/UC.Pmax[i],h:UC.Pmax[i]});});
  seg.sort((a,b)=>a.p-b.p);
  for(const s of seg){const q=Math.min(s.h,R);if(q>0){Pv[s.i]+=q;cost+=s.p*q;R-=q;}if(R<=1e-9)break;}
  if(R>1e-6)return null;
  const u=[0,1,2].map(i=>fix[i]===1?1:fix[i]===0?0:Pv[i]/UC.Pmax[i]);
  return {cost,P:Pv,u,frac:u.some(v=>v>1e-9&&v<1-1e-9)};
}
function bbSteps(){
  const D=+document.getElementById('dem3').value;
  document.getElementById('dem3v').textContent=D;
  const root=ucBound(D,[null,null,null]);
  const nodes=[]; let inc=Infinity, incSol=null, incFix=null;
  const S=[];
  const fixStr=f=>f.map((v,i)=>`u<sub>${UC.name[i]}</sub>=${v===null?'自由':v}`).join('、');
  const tbl=(r,f)=>r?('<table class="tb" style="margin:0;font-size:12px">'+
    '<tr><th>機</th><th>u の扱い</th><th class="n">P [MW]</th><th class="n">u</th></tr>'+
    [0,1,2].map(i=>{const fr=r.u[i]>1e-9&&r.u[i]<1-1e-9;
      return `<tr><td>${UC.name[i]}</td><td class="dimtx">${f[i]===null?'自由 [0,1]':'固定 '+f[i]}</td>`+
        `<td class="n">${F(r.P[i],1)}</td>`+
        `<td class="n" style="color:${fr?COL.ng:COL.dim}">${F(r.u[i],2)}${fr?' ⚠':''}</td></tr>`;}).join('')+
    '</table>'):'<p class="dimtx" style="margin:0">実行不能（容量が足りない、または下限の合計が需要を超える）</p>';
  S.push({phase:'準備',
    work:tbl(root,[null,null,null]),
    sym:'まず u ∈ {0,1} を u ∈ [0,1] に緩めた LP を解く（LP緩和）',
    num:root?`実効単価 b<sub>i</sub> + F<sub>i</sub>/P<sub>i</sub><sup>max</sup> = `+
      [0,1,2].map(i=>`${UC.name[i]}: ${F(UC.b[i]+UC.F[i]/UC.Pmax[i],2)}`).join('　')+
      ' の安い順に埋めるだけで解けます':'—',
    res:root?`LP下界 = <span class="cO">${F(root.cost,2)} $/h</span>`+
      (root.frac?'　<span class="cN">u が小数 ⇒ 物理的に無意味</span>':''):'—',
    note:'LP緩和は元問題より制約が緩いので、必ず真の最適値以下。つまり<b>下界</b>になります。これが刈り取りの根拠です。',
    nodes:[],inc:Infinity,root});
  (function dfs(fix,depth,id,parent){
    const r=ucBound(D,fix);
    const node={id,parent,depth,fix:[...fix],bound:r?r.cost:null,state:'open'};
    nodes.push(node);
    let verdict,note;
    if(!r){node.state='infeasible'; verdict='<span class="cN">実行不能 ⇒ この枝は捨てる</span>';
      note='固定した u では需要を満たせません。';}
    else if(r.cost>=inc-1e-9&&depth>0){node.state='pruned'; verdict=`<span class="cU">下界 ${F(r.cost,0)} ≥ 暫定最良 ${F(inc,0)} ⇒ 刈る</span>`;
      note='この枝をどれだけ深く掘っても、いま持っている整数解より良くはなりません。中を見ずに捨てられます。';}
    else if(depth===3){
      if(r.cost<inc){inc=r.cost;incSol=r;incFix=[...fix];node.state='incumbent';
        verdict=`<span class="cO">整数解 ${F(r.cost,0)} ⇒ 暫定最良を更新</span>`;
        note='すべての u が 0/1 なので、これは実行可能な整数解です。上界が下がりました。';}
      else{node.state='pruned';verdict='<span class="cU">整数解だが改善せず</span>';note='';}
    }
    else{node.state='branch'; verdict=`<span class="cD">下界 ${F(r.cost,0)} &lt; 暫定最良 ⇒ u<sub>${UC.name[depth]}</sub> で分枝</span>`;
      note=`u<sub>${UC.name[depth]}</sub> = 1 の枝と 0 の枝に分けて、深い方から順に調べます。`;}
    S.push({phase:depth===0?'根の節点':`深さ ${depth}`,
      work:tbl(r,fix),
      sym:`固定：${fixStr(fix)}`,
      num:r?`この節点の LP 下界 = ${F(r.cost,2)} $/h　／　暫定最良（上界）= ${isFinite(inc)?F(inc,2):'まだ無し'}`:'LP は解なし',
      res:verdict, note,
      nodes:nodes.map(n=>({...n})), inc, incFix:incFix?[...incFix]:null, incSol, root});
    if(node.state!=='branch')return;
    [1,0].forEach(v=>{const f=[...fix];f[depth]=v;dfs(f,depth+1,nodes.length,id);});
  })([null,null,null],0,0,-1);
  const gap=(root&&isFinite(inc))?100*(inc-root.cost)/root.cost:NaN;
  S.push({phase:'完了',
    work:tbl(incSol,incFix||[1,1,1]),
    sym:'探索終了。残った枝はすべて刈られたか実行不能',
    num:`訪問した節点 ${nodes.length} 個（全列挙なら 15 個）`,
    res:`最適値 = <span class="cO">${F(inc,2)} $/h</span>　u = ( ${incFix?incFix.join(', '):'—'} )　`+
        `整数ギャップ = <span class="${gap>0.01?'cN':'cO'}">${F(gap,2)} %</span>`,
    note:'実務では「ギャップが 0.1% を切ったら停止」のように打ち切ります。厳密解を諦めるのが標準になっている、唯一の階層です。',
    nodes:nodes.map(n=>({...n})),inc,incFix,incSol,root,done:1});
  S.root=root; S.D=D;
  return S;
}

/* =========================================================
   図：ニュートン法の幾何
   ========================================================= */
const N1D={f:d=>1.8*Math.sin(d)-0.8, df:d=>1.8*Math.cos(d)};
function fNewton(iter,sub){
  const g=cx('fNewton'); if(!g)return; clr(g);
  const x0=76,y0=30,W=590,H=250;
  const XL=-0.06,XH=1.32,YL=-1.05,YH=1.12;
  const px=x=>x0+W*(x-XL)/(XH-XL), py=y=>y0+H*(YH-y)/(YH-YL);
  GR(g,x0,y0,W,H,8,6);
  LN(g,[[x0,py(0)],[x0+W,py(0)]],COL.ink,1.8);
  const P=[];for(let k=0;k<=260;k++){const x=XL+(XH-XL)*k/260;P.push([px(x),py(N1D.f(x))]);}
  LN(g,P,COL.l,2.6);
  TM(g,'f (δ)',px(1.12),py(N1D.f(1.12))-20,COL.l,16,'left');
  for(let v=-1;v<=1;v+=0.5)T(g,v.toFixed(1),x0-8,py(v),COL.faint,11,'right',undefined,'o');
  for(let d=0;d<=1.2;d+=0.3)T(g,Math.round(d*180/Math.PI)+'°',px(d),y0+H+15,COL.faint,11,'center',undefined,'o');
  T(g,'位相角 δ',x0+W/2,y0+H+34,COL.dim,12.5,'center');
  const xs=[0]; for(let k=0;k<5;k++)xs.push(xs[k]-N1D.f(xs[k])/N1D.df(xs[k]));
  const done=Math.max(0,Math.min(4,iter));
  for(let j=0;j<=done;j++){
    const xj=xs[j], act=(j===done&&sub);
    if(j<done||act){
      const y=N1D.f(xj), xn=xs[j+1];
      LN(g,[[px(xj),py(y)],[px(xn),py(0)]],act?COL.d:tint(COL.d,.35),act?2.6:1.4,act?null:[5,4]);
      LN(g,[[px(xj),py(0)],[px(xj),py(y)]],tint(COL.faint,.8),1.2,[3,3]);
      if(act)T(g,'接線',px(xj)+14,(py(y)+py(0))/2+(j?-18:16),COL.d,12.5,'left');
    }
    DOT(g,px(xj),py(N1D.f(xj)),j===done?COL.ng:tint(COL.ng,.35),j===done?6:4);
    DOT(g,px(xj),py(0),j===done?COL.ok:tint(COL.ok,.35),j===done?5.5:3.5);
    TM(g,'δ'+j,px(xj),py(0)+18,j===done?COL.ok:COL.faint,14,'center');
  }
  const tx=x0+W+64;
  T(g,'1手の中身',tx,y0+10,COL.ink,14,'left');
  [['① いまの点で f を測る',COL.ng],['② その点の傾き f ′ で接線を引く',COL.d],
   ['③ 接線が横軸を切る点を次の点にする',COL.ok]]
   .forEach((l,i)=>T(g,l[0],tx,y0+42+i*26,l[1],13,'left'));
  T(g,'未知数が2個以上なら',tx,y0+150,COL.dim,12,'left');
  T(g,'f ′ → ヤコビアン J',tx,y0+174,COL.body,12.5,'left');
  T(g,'割り算 → J Δx = f を解く',tx,y0+198,COL.body,12.5,'left');
  T(g,'収束先 δ* = 26.3878°',tx,y0+232,COL.ok,13,'left');
  T(g,'接線が寝る（f ′→0）と次の点が遠くへ飛ぶ',tx,y0+256,COL.ng,12.5,'left');
}

/* ---------- 図：ノーズカーブ ---------- */
function fNose(mark){
  const g=cx('fNose'); if(!g)return; clr(g);
  const x0=72,y0=28,W=560,H=250;
  const XH=4.4;
  const px=p=>x0+W*p/XH, py=v=>y0+H*(1.15-v)/1.15;
  GR(g,x0,y0,W,H,8,6);

  }
  const tx=x0+W+56;
  T(g,'解が「消える」とはどういうことか',tx,y0+14,COL.ink,14,'left');
  ['上枝と下枝は、負荷を増やすと近づいてくる。',

/* =========================================================

function fRK4(st,hi){
  const g=cx('fRK4'); if(!g)return; clr(g);
  const x0=76,y0=30,W=560,H=250;
  if(!st||!st.k1){
    T(g,'「次へ」を押すと、1手の中で測る4つの傾きが出ます',g.W/2,g.H/2,COL.faint,14,'center');
    return;
  }
  const dt=SW.dt,t0=st.t0,d0=st.d0;
  const cand=[d0,st.dNew,st.eNew,d0+dt*st.k1[0],d0+dt*st.k4[0]];
  let lo=Math.min(...cand),hi2=Math.max(...cand);
  const pad=Math.max(.02,(hi2-lo)*.5); lo-=pad; hi2+=pad;
  const px=t=>x0+W*(t-t0)/(dt*1.22), py=d=>y0+H*(hi2-d)/(hi2-lo);
  GR(g,x0,y0,W,H,6,6);
  LN(g,[[px(t0+dt),y0],[px(t0+dt),y0+H]],COL.rule,1.2,[4,4]);
  LN(g,[[px(t0+dt/2),y0],[px(t0+dt/2),y0+H]],COL.rule,1.2,[4,4]);
  T(g,'t',px(t0),y0+H+15,COL.dim,12,'center');
  T(g,'t + Δt/2',px(t0+dt/2),y0+H+15,COL.dim,12,'center');
  T(g,'t + Δt',px(t0+dt),y0+H+15,COL.dim,12,'center');
  T(g,'1タイムステップの拡大（縦軸 δ [rad]）',x0+W/2,y0+H+35,COL.faint,12,'center');
  const seg=(t,d,s,len,col,w)=>LN(g,[[px(t),py(d)],[px(t+len),py(d+s*len)]],col,w,[5,4]);
  const ks=[['k₁',COL.d,t0,d0,st.k1,dt],
            ['k₂',COL.l,t0+dt/2,d0+dt/2*st.k1[0],st.k2,dt/2],
            ['k₃',COL.u,t0+dt/2,d0+dt/2*st.k2[0],st.k3,dt/2],
            ['k₄',COL.ng,t0+dt,d0+dt*st.k3[0],st.k4,-dt/2]];
  ks.forEach(([nm,col,t,d,k,len],q)=>{
    const on=!hi||hi===q+1, a=on?1:.16;
    g.save(); g.globalAlpha=a;
    seg(t,d,k[0],len,col,on?2.4:1.4);
    DOT(g,px(t),py(d),col,on?6:4);
    TM(g,nm,px(t)+10,py(d)-16,col,17,'left');
    g.restore();
  });
  g.save(); g.globalAlpha=hi&&hi<5?.2:1;
  AR(g,px(t0),py(d0),px(t0+dt),py(st.dNew),COL.ok,2.8);
  DOT(g,px(t0+dt),py(st.dNew),COL.ok,7);
  T(g,'RK4',px(t0+dt)+11,py(st.dNew),COL.ok,13,'left');
  g.restore();
  g.save(); g.globalAlpha=hi&&hi<5?.15:1;
  LN(g,[[px(t0),py(d0)],[px(t0+dt),py(st.eNew)]],COL.ng,2,[6,4]);
  DOT(g,px(t0+dt),py(st.eNew),COL.ng,6);
  T(g,'オイラー',px(t0+dt)+11,py(st.eNew),COL.ng,13,'left');
  g.restore();
  DOT(g,px(t0),py(d0),COL.ink,6);
  const tx=x0+W+58;
  T(g,'重み付き平均で進む',tx,y0+14,COL.ink,14,'left');
  [['k₁',1,COL.d],['k₂',2,COL.l],['k₃',2,COL.u],['k₄',1,COL.ng]].forEach((w,i)=>{
    const y=y0+50+i*34, on=!hi||hi===i+1;
    g.save(); g.globalAlpha=on?1:.25;
    TM(g,w[0],tx,y,w[2],16,'left');
    g.fillStyle=tint(w[2],.24); g.fillRect(tx+34,y-9,w[1]*40,18);
    g.strokeStyle=w[2]; g.lineWidth=1.2; g.strokeRect(tx+34.5,y-8.5,w[1]*40,18);
    T(g,'×'+w[1],tx+34+w[1]*40+9,y,COL.dim,12,'left');
    g.restore();
  });
  T(g,'合計を 6 で割る',tx,y0+192,COL.body,12.5,'left');
  T(g,'オイラーは k₁ だけ（1回）',tx,y0+218,COL.ng,12.5,'left');
  T(g,'誤差 O(Δt²) → RK4 は O(Δt⁵)',tx,y0+242,COL.ok,12.5,'left');
}

function fBBTree(st){

  const slot=n=>{let k=0;for(let d=0;d<n.depth;d++)k=k*2+(n.fix[d]===1?0:1);return k;};
  const pos={};
  all.forEach(n=>{pos[n.id]={x:W*(slot(n)+.5)/SLOT[n.depth],y:28+n.depth*(H-72)/3};});
  all.forEach(n=>{

}

function drawGEside(i){
  const g=cx('fGEside'); if(!g)return; clr(g);
  const n=3,cw=58,ch=38,x0=(g.W-cw*4-18)/2,y0=32;
  const elim=[[1,0],[2,0],[2,1]];
  for(let r=0;r<n;r++)for(let c=0;c<4;c++){
    const x=x0+c*cw+(c===3?18:0), y=y0+r*ch;
    let col=COL.faint,bg=null;
    const ei=elim.findIndex(([a,b])=>a===r&&b===c);
    if(ei>=0){ if(i-1>ei){col=COL.ok;bg=tint(COL.ok,.14);}
      else if(i-1===ei){col=COL.d;bg=tint(COL.d,.16);}
      else {col=COL.ng;bg=tint(COL.ng,.08);} }
    else if(c===3)col=COL.dim; else if(r<=c)col=COL.l;
    if(bg){g.save();g.fillStyle=bg;g.fillRect(x+1,y+1,cw-2,ch-2);g.restore();}
    g.save();g.strokeStyle=COL.hair;g.strokeRect(x+.5,y+.5,cw-1,ch-1);g.restore();
    const s=(ei>=0&&i-1>=ei)?'0':(c===3?'b'+(r+1):'a'+(r+1)+(c+1));
    TM(g,s,x+cw/2,y+ch/2,col,14,'center');
  }
  T(g, i===0?'まだ何もしていない': i<=3?`前進消去 ${i} / 3 手`:`後退代入 ${Math.min(3,i-3)} / 3 手`,
    g.W/2,y0+n*ch+26,i<=3?COL.d:COL.ok,13,'center');
  if(i>=7)T(g,'完了 — 6手で厳密解',g.W/2,y0+n*ch+50,COL.ok,13.5,'center');
}
function drawRhoChart(){
  const A=IT.A,b=IT.b,xe=mat.solve(A,b),K=10;
  const run=(m,w)=>{
    const save=itMethod; itMethod=m;
    let x=[0,0,0],out=[Math.max(...xe.map(Math.abs))];
    for(let s=0;s<K;s++){
      const xo=x.slice();
      for(let i=0;i<3;i++){
        const src=m==='J'?xo:x;
        const raw=(b[i]-A[i].reduce((a,v,j)=>j===i?a:a+v*src[j],0))/A[i][i];
        x=x.slice(); x[i]=m==='SOR'?x[i]+w*(raw-x[i]):raw;
      }
      out.push(Math.max(...x.map((v,i)=>Math.abs(v-xe[i]))));
    }
    itMethod=save; return out;
  };
  logChart('fRhoChart',[[run('SOR',1.15),COL.u,1.6,[5,4]],[run('J'),COL.gold,2.2],[run('GS'),COL.l,2.2]],
    K,0,-8,'掃引',[['ヤコビ  ρ = 0.672',COL.gold,0],['ガウス・ザイデル  ρ = 0.459',COL.l,20],['SOR ω=1.15  ρ = 0.233',COL.u,40]]);
}

  const h=steps[i].hist||[];

function drawOdeTr(steps,i){
  const st=steps[i], g=cx('fOdeTr'); if(!g)return; clr(g);
  const x0=52,y0=18,W=g.W-76,H=g.H-56;
  GR(g,x0,y0,W,H,6,6);
  const TX=SW.dt*SW.N, DY=Math.PI*1.5;
  const px=t=>x0+W*t/TX, py=d=>y0+H*(1-d/DY);
  for(let dg=0;dg<=270;dg+=45)T(g,dg+'°',x0-8,py(dg*Math.PI/180),COL.faint,10.5,'right',undefined,'o');
  for(let t=0;t<=TX+1e-9;t+=0.25)T(g,t.toFixed(2),px(t),y0+H+15,COL.faint,10.5,'center',undefined,'o');
  T(g,'時間 [s]　／　縦軸 δ',x0+W/2,y0+H+33,COL.dim,12,'center');
  const dmax=Math.PI-Math.asin(SW.Pm/SW.Ppost);
  LN(g,[[x0,py(dmax)],[x0+W,py(dmax)]],COL.u,1.4,[4,4]);
  T(g,'δmax',x0+W-6,py(dmax)-12,COL.u,11.5,'right');
  LN(g,[[px(steps.tc),y0],[px(steps.tc),y0+H]],COL.d,1.4,[4,3]);
  T(g,'遮断',px(steps.tc)+6,y0+13,COL.d,11.5,'left');
  const cl=p=>p.map(([t,d])=>[px(t),py(Math.min(d,DY))]);
  LN(g,cl(st.tre),COL.ng,1.8,[5,4]);
  LN(g,cl(st.tr),COL.ok,2.4);
  const L=st.tr[st.tr.length-1];
  DOT(g,px(L[0]),py(Math.min(L[1],DY)),COL.d,5.5);
}

      <div class="dvPrev"></div><div class="dvArrow"></div>
      <div class="dvNow"></div><div class="say"></div>
      <div class="dvFoot">
        <div class="card"><h4>置いた仮定</h4><ol class="asl"></ol></div>
        <div class="card"><h4>${s.col2||'失うもの'}</h4><ol class="lsl"></ol></div>
      </div></div>`;
  } else if(s.lay==='board'){
    body=`<div class="body board">${s.extra||''}</div>`;
  } else if(s.lay==='title'){
    const figH=CH-14-150;
    body=`<div class="body hero" style="grid-template-rows:1fr 150px">
      ${canvasHTML(s,CW,figH)}<div>${s.extra||''}</div></div>`;
  } else {
    const ctlH=s.ctl?50:0;
    const rows=[ctlH?ctlH+'px':null, eqH?eqH+'px':null, '1fr', '92px'].filter(Boolean);
    const gaps=(rows.length-1)*14;
    const figH=CH-ctlH-eqH-gaps-92;
    body=`<div class="body hero" style="grid-template-rows:${rows.join(' ')}">
      ${s.ctl||''}${eq}${canvasHTML(s,CW,figH)}<div class="say"></div></div>`;
  }
  d.innerHTML=`<div class="shead"><span class="lv">LEVEL ${s.lv}</span><span class="tp">${s.tp}</span>
      <span class="no">${String(i+1).padStart(2,'0')} / ${SL.length}</span></div>
    <h2>${s.title}</h2>${s.msg?`<p class="msg">${s.msg}</p>`:''}<div class="rulez"></div>${body}`;
  stage.appendChild(d); s.el=d; s.n=s.der?s.der.length:(s.n||1);
});
/* 目次 */
const rws=document.getElementById('rws'); let lastLv=null;
SL.forEach((s,i)=>{
  if(s.lv!==lastLv){lastLv=s.lv;
    const h=document.createElement('div'); h.className='grp';
    h.textContent='LEVEL '+s.lv+' · '+s.tp; rws.appendChild(h);}
  const b=document.createElement('button'); b.className='rw'; b.textContent=s.title;
  b.onclick=()=>{go(i);document.body.classList.remove('nav');};
  rws.appendChild(b); s.rw=b;
});
/* ステージ拡縮 */
function fit(){
  const w=document.getElementById('wrap');
  const k=Math.min(w.clientWidth/SW_, w.clientHeight/SH_);
  stage.style.transform='scale('+k+')';
}
addEventListener('resize',fit);

let cur=0, step=0, timer=null;
const dots=document.getElementById('dots');
function setFocus(sl,key){
  sl.el.querySelectorAll('.mq .t').forEach(sp=>{
    sp.classList.toggle('dim',!!key&&sp.dataset.k!==key);
    sp.classList.toggle('hot',!!key&&sp.dataset.k===key);});
}
function fitMath(root){
  if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('.mq').forEach(el=>{
    el.style.fontSize='';
    const box=el.parentElement; if(!box)return;
    const avail=box.clientWidth; if(!avail)return;
    const w=el.scrollWidth; if(!w||w<=avail)return;
    const base=parseFloat(getComputedStyle(el).fontSize)||30;
    el.style.fontSize=Math.max(14,base*avail/w*0.97).toFixed(1)+'px';
  });
}
function renderStep(){
  const s=SL[cur];
  if(s.lay==='algo'){
    const st=s._steps[step]||{}, root=document.getElementById('stp'+cur);
    root.querySelector('.stwork').innerHTML=st.work||'';
    root.querySelector('.sym').innerHTML=st.sym||'';
    root.querySelector('.num').innerHTML=st.num||'';
    root.querySelector('.res').innerHTML=st.res||'';
    root.querySelector('.stnote').innerHTML=(st.phase?`<span class="stph">${st.phase}</span>　`:'')+(st.note||'');
    if(s.draw)s.draw(s._steps,step);
  } else if(s.lay==='derive'){
    const D=s.der, cur=D[step], prev=step>0?D[step-1]:null;
    s.el.querySelector('.dvPrev').innerHTML=prev?`<span class="mq sm">${prev.eq}</span>`:'';
    s.el.querySelector('.dvArrow').innerHTML=cur.assume
      ?`<span class="ar">↓</span><span class="asm">${cur.assume}</span>`:'';
    s.el.querySelector('.dvNow').innerHTML=`<span class="mq">${cur.eq}</span>`
      +(cur.cap?`<div class="cap">${cur.cap}</div>`:'');
    const as=[],ls=[];
    for(let k=0;k<=step;k++){
      if(D[k].assume)as.push(D[k].assume);
      if(D[k].lost)ls.push(D[k].lost); else if(D[k].gain)ls.push(D[k].gain);}
    s.el.querySelector('.asl').innerHTML=as.map((t,q)=>
      `<li${q===as.length-1?' class="fresh"':''}>${t}</li>`).join('');
    s.el.querySelector('.lsl').innerHTML=ls.map((t,q)=>
      `<li${q===ls.length-1?' class="fresh"':''}>${t}</li>`).join('');
    const el=s.el.querySelector('.say');
    el.innerHTML=cur.say||''; el.classList.toggle('k',!!cur.say);
  } else {
    if(s.render)s.render(step);
    if(s.keys)setFocus(s,s.keys[step]||null);
    const el=s.el.querySelector('.say');
    if(el){const t=(s.say&&s.say[step])||(step===0?'':'')||s.cap2||'';
      el.innerHTML=t; el.classList.toggle('k',!!(s.say&&s.say[step]));}
  }
  dots.innerHTML='';
  if(s.n>1)for(let k=0;k<s.n;k++){const d=document.createElement('i');
    d.className=k===step?'on':k<step?'past':''; dots.appendChild(d);}
  document.getElementById('where').innerHTML=
    `LEVEL ${s.lv} · ${s.tp}　<b>${String(cur+1).padStart(2,'0')}</b> / ${SL.length}`;
  fitMath(s.el);
  document.getElementById('bPrev').disabled=(cur===0&&step===0);
  document.getElementById('bNext').disabled=(cur===SL.length-1&&step>=s.n-1);
}
function go(i,atEnd){
  stopAuto();
  cur=Math.max(0,Math.min(SL.length-1,i));
  const s=SL[cur];
  SL.forEach((q,k)=>{q.el.classList.toggle('on',k===cur);
    q.rw.classList.toggle('on',k===cur); q.rw.classList.toggle('done',k<cur);});
  if(s.build){s._steps=s.build(); s.n=s._steps.length;}
  step=atEnd?s.n-1:0;
  renderStep();
  if(s.rw.scrollIntoView)s.rw.scrollIntoView({block:'nearest'});
}
function next(){const s=SL[cur];
  if(step<s.n-1){step++;renderStep();} else if(cur<SL.length-1)go(cur+1);}
function prev(){if(step>0){step--;renderStep();} else if(cur>0)go(cur-1,true);}
function stopAuto(){if(timer){clearInterval(timer);timer=null;
  document.getElementById('bAuto').textContent='自動';}}
document.getElementById('bNext').onclick=()=>{stopAuto();next();};
document.getElementById('bPrev').onclick=()=>{stopAuto();prev();};
document.getElementById('bNav').onclick=()=>document.body.classList.toggle('nav');
document.getElementById('bSkip').onclick=()=>{stopAuto();
  const s=SL[cur]; if(step<s.n-1){step=Math.min(s.n-1,step+10);renderStep();} else next();};
document.getElementById('scrim').onclick=()=>document.body.classList.remove('nav');
document.getElementById('bAuto').onclick=e=>{
  if(timer)stopAuto();
  else{e.target.textContent='停止';
    timer=setInterval(()=>{if(cur===SL.length-1&&step>=SL[cur].n-1)stopAuto();else next();},900);}};
addEventListener('keydown',e=>{
  if(/input|textarea/i.test(e.target.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();stopAuto();go(cur+1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();stopAuto();go(cur-1);}
  else if(e.key===' '||e.key==='n'||e.key==='N'){e.preventDefault();stopAuto();next();}
  else if(e.key==='b'||e.key==='B'){e.preventDefault();stopAuto();prev();}
  else if(e.key==='m'||e.key==='M')document.body.classList.toggle('nav');
  else if(e.key==='Escape')document.body.classList.remove('nav');
});
function wireSeg(segId,rowId,wId,wvId,after){
  const seg=document.getElementById(segId); if(!seg)return;
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    itMethod=b.dataset.m;
    seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    const r=document.getElementById(rowId); if(r)r.style.display=itMethod==='SOR'?'flex':'none';
    after&&after();});
  const w=document.getElementById(wId);
  if(w)w.addEventListener('input',()=>{
    document.getElementById(wvId).textContent=(+w.value).toFixed(2);
    const main=document.getElementById('itw'); if(main&&main!==w)main.value=w.value;
    after&&after();});
}
wireSeg('segM','rowW','itw','itwv',()=>renderStep());
wireSeg('segM2','rowW2','itw2','itwv2',()=>{const a=document.getElementById('itw2'),b=document.getElementById('itw');
  if(a&&b)b.value=a.value; go(cur);});
['nrpl','odetc','dem2','dem3'].forEach(id=>{
  const el=document.getElementById(id); if(!el)return;
  el.addEventListener('input',()=>{
    const lab=document.getElementById(id+'v');
    if(lab)lab.textContent=(id==='nrpl'||id==='odetc')?(+el.value).toFixed(2):el.value;
    go(cur);});});
fit(); go(0);

</script>
